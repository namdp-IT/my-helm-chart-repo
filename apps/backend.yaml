apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/namdp-it/my-helm-chart-repo.git'
    targetRevision: HEAD
    path: my-app-chart
    helm:
      values: |
        replicaCount: 2
        image:
          repository: ghcr.io/namdp-it/task-backend
          tag: "v1.0.0"
        service:
          port: 8080
          targetPort: 8080
        env:
          - name: DB_HOST
            value: "task-db" # Kết nối bằng tên Service của Postgres
          - name: DB_PORT
            value: "5432"
          - name: DB_NAME
            value: "taskdb"
          - name: DB_USER
            value: "postgres"
          - name: DB_PASSWORD
            value: "secret123"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: task-app
  syncPolicy:
    automated: { prune: true, selfHeal: true }
